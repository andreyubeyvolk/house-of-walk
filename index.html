  /* moving the browser window to another display (different refresh rate /
     GPU output, or just losing and regaining focus during the move) can
     leave the AudioContext suspended by Chrome without any error or event
     we'd normally catch, which reads as "sound is just gone" until something
     else happens to resume it. Cover every point that can plausibly bring it
     back: regaining window focus, the tab becoming visible again, and a
     periodic watchdog as a last-resort net. resume() on an already-running
     context is a harmless no-op. */
  window.addEventListener('focus', function(){ if(audioCtx) ensureAudio(); });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && audioCtx) ensureAudio();
  });
  setInterval(function(){
    if(audioCtx && audioCtx.state === 'suspended'){ ensureAudio(); }
  }, 2000);
  function playTick(){
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    if(now - lastTick < 55) return;
    lastTick = now;
    var ctx = ensureAudio();
    if(!ctx) return;
    try{
      var t = ctx.currentTime;
      var osc = ctx.createOscillator();
      var filter = ctx.createBiquadFilter();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(190, t);
      osc.frequency.exponentialRampToValueAtTime(120, t + 0.03);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(450, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.0525, t + 0.004); /* 0.05 + 5% */
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.042);
      osc.connect(filter).connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.05);
    }catch(e){}
  }
  /* every scrollable strip on the site (the main page, the essay panel, the
     horizontal filmstrip) wants a tick roughly once per STEP px of actual
     travel, regardless of what's driving that travel. That "regardless" is
     the whole point: a mouse wheel notch covers ~100px in one 'wheel' event,
     so gating on events-since-last-tick reads fine, but a trackpad delivers
     the same 100px as a burst of a dozen-plus tiny events — gate on THAT and
     it fires a dozen ticks where a mouse fired one, a machine-gun rather
     than a ratchet. Gating on distance covered instead of event count gets
     the mouse and the trackpad to sound the same, because it no longer
     matters how many events it took to cover the ground.

     One call site per scrollable strip, each with its own gate — the essay
     panel and the filmstrip are independent scroll positions, ticking off
     one doesn't consume the other's budget. null rather than 0 as the
     initial position, so the very first movement of a session reads as
     "haven't ticked yet" rather than "moved 0 -> wherever", which would
     fire immediately regardless of how far that first movement actually was. */
  function makeTickGate(step){
    var last = null;
    return {
      check: function(pos){
        if(last === null){ last = pos; return false; }
        if(Math.abs(pos - last) < step) return false;
        last = pos;
        return true;
      },
      /* for a position that jumped for a reason that isn't the reader's
         input (the viewer/essay opening, or the filmstrip re-centering on a
         newly opened photo) — the next real movement should be measured
         from here, not from wherever the gate last saw. Called with no
         argument, the gate forgets its baseline outright: the same as never
         having ticked at all, for a scroll container that just came into
         relevance and has no ground truth of its own yet to reset to. */
      reset: function(pos){ last = (arguments.length ? pos : null); }
    };
  }
  function playWhoosh(dir, opts){
    opts = opts || {};
    var rough = !!opts.rough;
    var vol = opts.vol || 0.0324;
    /* the closing sweep dips down toward 180Hz while opening sweeps up
       toward 650Hz; at the same linear gain, the lower end is quieter to
       the ear (equal-loudness perception) and most laptop speakers also
       roll off well before 200Hz, so "close" ended up reading as barely
       audible next to "open" even though the code used the same volume for
       both. Compensate, but only when the caller hasn't already picked an
       explicit volume of its own (the to-top button's rough whoosh does). */
    if(dir === 'close' && !opts.vol) vol *= 1.4;
    var ctx = ensureAudio();
    if(!ctx) return;
    try{
      var t = ctx.currentTime;
      var dur = 0.24;
      var bufferSize = Math.max(1, Math.round(ctx.sampleRate * dur));
      var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for(var i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
      var noise = ctx.createBufferSource();
      noise.buffer = buffer;
      var filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = rough ? 0.35 : 0.8;
      var startFreq = dir === 'open' ? 220 : 650;
      var endFreq   = dir === 'open' ? 650 : 240;
      filter.frequency.setValueAtTime(startFreq, t);
      filter.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      var gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(vol, t + dur*0.35);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      var lastNode = filter;
      if(rough){
        var shaper = ctx.createWaveShaper();
        var curve = new Float32Array(256);
        for(var j=0;j<256;j++){ var x = j/128-1; curve[j] = Math.tanh(x*1.6); }
        shaper.curve = curve;
        filter.connect(shaper);
        lastNode = shaper;
      }
      noise.connect(filter);
      lastNode.connect(gain).connect(ctx.destination);
      noise.start(t);
      noise.stop(t + dur + 0.02);
    }catch(e){}
  }
  function playThemeClick(){
    var ctx = ensureAudio();
    if(!ctx) return;
    try{
      var t = ctx.currentTime;
      var osc = ctx.createOscillator();
      var filter = ctx.createBiquadFilter();
      var gain = ctx.createGain();
      /* was a 120->55Hz sine under a 220Hz lowpass — almost entirely below
         what a phone speaker actually reproduces, and quieter than the
         scroll tick on top of that, which is why it read as near-silent.
         Triangle (more harmonic content than sine) sweeping through a
         range small speakers handle, a filter open enough to let that
         content through, and a peak gain matching the tick's rather than
         sitting under it. */
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(260, t);
      osc.frequency.exponentialRampToValueAtTime(140, t + 0.05);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(900, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.05, t + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      osc.connect(filter).connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.08);
    }catch(e){}
  }

  var grid = document.getElementById('grid');
  var gridHtml = '';
  ARCHIVE.forEach(function(f){
    /* an essay's cover slots in right before its trip's first photo — keyed
       off the per-photo code (e.g. "KAS_NOV25_0001") rather than tracking
       WALKS/wi separately, since the code already encodes both the trip
       and "this is photo #1 of it" in one string. */
    var essay = ESSAYS[f.code.split('_')[0]];
    if(essay && f.seq === 1){
      gridHtml += '<div class="cell essay-cover" role="button" tabindex="0" data-essay="'+f.code.split('_')[0]+'" '
        + 'style="--ar:'+essay.coverAr+'">'
        + '<div class="tag"><span>'+essay.cardLabel+'</span></div>'
        + '<div class="ph real loaded"><img src="'+essay.cover+'" alt="'+essay.title+': '+essay.subtitle+'" loading="lazy"></div>'
        + '</div>';
    }
    gridHtml += '<div class="cell'+(f.land?' land':'')+'" role="button" tabindex="0" data-gi="'+f.gi+'" '
      + 'style="--ar:'+f.ar+'">'
      + '<div class="tag"><span>'+f.code+'</span></div>'
      + phHtml(f, false, true, true)
      + '</div>';
  });
  grid.innerHTML = gridHtml;

  /* flips .ph to .loaded once its image has actually painted, which is what
     gates the vignette (see .ph.loaded::after in CSS). The full-res .ph-full
     is deliberately excluded — it fades in over the thumb that's already
     there, so the plate is no longer "empty" by the time it arrives. */
  function watchPhImages(root){
    root.querySelectorAll('.ph.real img:not(.ph-full)').forEach(function(img){
      var ph = img.parentNode;
      if(img.complete && img.naturalWidth){ ph.classList.add('loaded'); return; }
      img.addEventListener('load', function(){ ph.classList.add('loaded'); }, {once:true});
    });
  }
  watchPhImages(grid);

  /* ---------- image loading + preloader ----------
     Two halves of one thing. The preloader holds the page until the first
     couple of screens of thumbnails are decoded and in the document, so the
     curtain lifts onto real photographs rather than grey plates; everything
     past that arrives on approach as you scroll. */
  (function(){
    var cells = Array.prototype.slice.call(grid.querySelectorAll('.cell'));

    var revealed = false;
    function imgOf(cell){ return cell.querySelector('.ph img[data-src]'); }
    function startLoad(img){
      if(!img || img.getAttribute('src')) return false;
      /* a photo arriving changes its row's height, which can bring the next
         row inside the runway without anyone having scrolled — so every
         arrival re-checks. Costs one comparison, thanks to the cursor. While
         the curtain is still up this stays off: the first screens are meant
         to have the connection to themselves. */
      img.addEventListener('load', function(){ if(revealed) loadForScroll(); }, {once:true});
      img.setAttribute('src', img.getAttribute('data-src'));
      return true;
    }

    /* THE first portion: whatever the grid puts inside the first two screens,
       which is what someone actually sees before they scroll — a count would
       be wrong at one breakpoint or the other, since the same photos are
       many rows on a phone and few on a desktop. Floored at 40 so even a
       short window is worth genuinely having ready (these are thumbnails,
       ~18KB each — 40 of them is under 1MB), capped so a very tall window
       doesn't turn the loader into a wait for half the archive. */
    var vh = window.innerHeight || 800;
    var firstCount = 0;
    for(var i=0;i<cells.length;i++){
      if(cells[i].offsetTop < vh*2) firstCount++;
      else break;
    }
    firstCount = Math.min(cells.length, Math.max(40, Math.min(80, firstCount)));

    /* THE rest, on approach: everything down to two and a half viewport
       heights from the current scroll position, which is the screen you are
       on plus a screen and a half of runway. Far enough ahead that an
       ordinary scroll never outruns it, near enough that opening the page
       and leaving it alone doesn't pull the whole archive down.

       A cursor rather than a filter: the grid is in document order and rows
       only ever move down the page, so every cell before the cursor is
       already loaded and nothing has to be rescanned. The whole pass costs
       one comparison once the cursor has caught up.

       Deliberately not IntersectionObserver. It would be the idiomatic
       choice, but it only reports through the rendering pipeline, so in any
       context where that is suspended it silently never fires and the grid
       below the first screens would simply stay empty — and "silently never
       fires" is not a failure mode worth taking on for the thing that
       delivers the actual photographs. Scroll position is a number that can
       be read at any time. */
    var cursor = 0;
    function loadDownTo(limitY){
      while(cursor < cells.length && cells[cursor].offsetTop <= limitY){
        startLoad(imgOf(cells[cursor]));
        cursor++;
      }
    }
    function loadForScroll(){
      var top = window.pageYOffset || document.documentElement.scrollTop || 0;
      loadDownTo(top + (window.innerHeight || 800) * 2.5);
    }
    /* ---------- opportunistic full-resolution prefetch ----------
       Opening a photo has always started that specific full-resolution
       fetch from zero at the moment you tap it — that's the ~700ms
       blur-to-sharp gap between the cached grid thumbnail showing instantly
       and the real image fading in over it. This warms photos on approach
       WHILE SCROLLING THE MAIN PAGE — the same runway the thumbnail loader
       gets (2.5 screens ahead), not just whatever's on screen at the exact
       instant a scan happens — so a photo is usually already in the HTTP
       cache well before you actually reach and tap it.

       An earlier version used the strictly-visible viewport with no runway
       at all, on the reasoning that a full photo is ~30x its thumbnail's
       weight (~650KB vs ~18KB) and a generous window would pull too much of
       the archive for photos scrolled past and never opened. That reasoning
       had a real bug in it: scrolling through the ENTIRE page eventually
       shows every photo either way, so the window's size doesn't change how
       much ends up fetched over a full read-through — only how much LEAD
       TIME each photo gets before you might tap it. A tight window gives it
       almost none, which is exactly the "scrolled to it and opened it
       immediately, still blurry" this was supposed to fix. The actual
       safety net is elsewhere: fetchPriority:'low' plus a small MAX_PARALLEL
       so this never competes with anything the reader is actually waiting
       on, and the connection guard below for links too slow to spend on
       anything speculative.

       Still "probably already warm", not "guaranteed ready" — flick through
       faster than the runway and the network can cover, or open something
       within instants of it entering the runway, and the same brief blur
       can still show. */
    var fullPrefetchStarted = false;
    function initFullPrefetch(){
      /* called from two places now — right alongside the initial thumbnail
         batch (the common case) and again from watchRest()'s fallback path
         for the rare case of no preloader element at all. Idempotent so
         neither call site has to know about the other. */
      if(fullPrefetchStarted) return;
      fullPrefetchStarted = true;
      var conn = navigator.connection || navigator.webkitConnection || navigator.mozConnection;
      if(conn && (conn.saveData || /2g/.test(conn.effectiveType || ''))) return;

      var prefetched = {};
      var queue = []; /* gi values, kept sorted nearest-to-current-view first */
      var inFlight = 0, MAX_PARALLEL = 2;
      function pump(){
        while(inFlight < MAX_PARALLEL && queue.length){
          var f = ARCHIVE[queue.shift()];
          if(!f || !f.img) continue;
          inFlight++;
          var img = new Image();
          try{ img.fetchPriority = 'low'; }catch(e){}
          var done = function(){ inFlight--; pump(); };
          img.onload = done; img.onerror = done;
          img.src = f.img;
        }
      }
      /* requestIdleCallback's own {timeout} option is supposed to be this
         exact guarantee — run anyway once the timeout elapses, even without
         genuine idle time — but that guarantee turned out not to be
         trustworthy: a background/non-compositing tab can leave a callback
         registered with a 2000ms timeout waiting far longer than 2000ms,
         since idle detection and its fallback timer both appear to be tied
         to the same rendering-adjacent scheduling that a hidden tab
         suspends. Racing it against a plain setTimeout — whichever fires
         first wins, and the loser is a no-op via `done` — keeps the "defer
         to genuine idle time when it's available" behaviour while putting a
         hard, unconditional ceiling on how long it can possibly wait. */
      function idle(fn){
        var done = false;
        function run(){ if(done) return; done = true; fn(); }
        if(window.requestIdleCallback) requestIdleCallback(run, {timeout:600});
        setTimeout(run, 600);
      }
      /* gi → its own grid cell, built once: the queue carries ARCHIVE
         indices and the sort needs each one's real position on the page. */
      var cellByGi = {};
      cells.forEach(function(c){
        if(c.dataset.gi !== undefined) cellByGi[+c.dataset.gi] = c;
      });
      function scan(){
        var vh = window.innerHeight || 800;
        var top = window.pageYOffset || document.documentElement.scrollTop || 0;
        /* same 2.5-screen runway as the thumbnail loader (loadForScroll) —
           see the comment above for why matching it, not shrinking it, is
           the actual fix */
        var bottom = top + vh * 2.5;
        var viewCenter = top + vh/2;
        var addedAny = false;
        cells.forEach(function(c){
          /* essay cover cards are real grid cells with no archive photo
             behind them, so they carry no data-gi. Skipping them is not
             just an optimisation: +undefined is NaN, which passed the
             prefetched[] check every time and went into the queue, where
             the sort below then looked up cells[NaN] and threw. */
          if(c.dataset.gi === undefined) return;
          var t = c.offsetTop, b = t + c.offsetHeight;
          if(b < top || t > bottom) return; /* not on screen or in the runway */
          var gi = +c.dataset.gi;
          if(prefetched[gi]) return;
          prefetched[gi] = true;
          queue.push(gi);
          addedAny = true;
        });
        /* nearest-to-current-view first, re-sorted on every scan rather than
           appended in DOM order: a fast flick can drop dozens of newly
           in-range cells into the queue at once, and DOM order would put
           whatever's furthest along the row BEHIND everything the reader
           scrolled past to get there — exactly backwards from what a low
           concurrency limit (2 at a time) needs prioritised. Cheap: the
           queue is at most a few dozen entries, sorted a few times a
           second at most while actively scrolling. */
        if(addedAny){
          queue.sort(function(giA, giB){
            /* gi indexes ARCHIVE, not cells — the two stopped lining up the
               moment the essay cover cards were inserted into the grid as
               extra cells of their own. Look each one's real cell up by its
               own data-gi rather than assuming the positions match. */
            var ca = cellByGi[giA], cb = cellByGi[giB];
            if(!ca || !cb) return 0;
            return Math.abs(ca.offsetTop - viewCenter) - Math.abs(cb.offsetTop - viewCenter);
          });
          idle(pump);
        }
      }
      idle(scan);
      window.addEventListener('scroll', function(){ idle(scan); }, {passive:true});
      window.addEventListener('resize', function(){ idle(scan); });
    }

    function watchRest(){
      revealed = true;
      loadForScroll();
      initFullPrefetch();
      window.addEventListener('scroll', loadForScroll, {passive:true});
      window.addEventListener('resize', loadForScroll);
    }

    var el = document.getElementById('preloader');
    if(!el){ watchRest(); return; }
    var barEl = document.getElementById('preloaderBar');
    var pctEl = document.getElementById('preloaderPct');
    var CX = 50, CY = 50, R = 46;

    /* the arc is an explicit path rather than the usual stroke-dashoffset
       trick: with a path, "starts at twelve o'clock" and "runs
       counter-clockwise" are just a start angle and a sweep flag, instead of
       a mirrored transform whose handedness has to be reasoned about. */
    function setArc(p){
      if(p <= 0){ barEl.setAttribute('d',''); return; }
      /* a whole turn would put the start and end points on top of each
         other, which SVG renders as nothing at all — stop a hair short of
         closing the seam */
      var span = Math.min(p, 0.9999) * 360;
      var a0 = -90 * Math.PI/180;
      var a1 = (-90 - span) * Math.PI/180;
      var x0 = CX + R*Math.cos(a0), y0 = CY + R*Math.sin(a0);
      var x1 = CX + R*Math.cos(a1), y1 = CY + R*Math.sin(a1);
      barEl.setAttribute('d',
        'M'+x0.toFixed(3)+' '+y0.toFixed(3)+
        ' A'+R+' '+R+' 0 '+(span > 180 ? 1 : 0)+' 0 '+x1.toFixed(3)+' '+y1.toFixed(3));
    }

    var lastPct = -1;
    function render(p){
      p = Math.max(0, Math.min(1, p));
      setArc(p);
      var pct = Math.round(p*100);
      if(pct === lastPct) return;
      lastPct = pct;
      pctEl.textContent = pct+'%';
      el.setAttribute('aria-valuenow', pct);
    }

    var batch = [];
    for(var j=0;j<firstCount;j++){
      var im = imgOf(cells[j]);
      if(im) batch.push(im);
    }
    var total = batch.length;
    /* full-res of the first screens starts right alongside the thumbnails,
       not after the curtain drops. Used to wait for watchRest() on the
       reasoning that the curtain phase should have the connection to
       itself — but that meant every session opened with a full-res fetch
       starting from zero the moment the curtain lifted and a photo got
       tapped, which is the exact multi-second wait this was supposed to
       avoid. initFullPrefetch's own low fetchPriority + MAX_PARALLEL:2
       (versus the thumbnail batch's 6) is what keeps it from actually
       competing for the thumbnails' bandwidth. */
    initFullPrefetch();
    var loaded = 0;
    var targetP = total ? 0 : 1;
    var shownP = 0;
    var finished = false;

    /* nothing can scroll behind a full-screen curtain anyway, but without
       this a flick during the wait lands the reader somewhere down the grid
       the moment it lifts. Its own property, not body.overflow, which the
       viewer owns. */
    document.documentElement.style.overflow = 'hidden';

    var stepTimer = null;
    function finish(){
      if(finished) return;
      finished = true;
      if(stepTimer){ clearInterval(stepTimer); stepTimer = null; }
      render(1);
      document.documentElement.style.overflow = '';
      /* the rest of the THUMBNAILS start loading only now — full-res
         prefetch for the first screens is already under way (see
         initFullPrefetch() above), this is just the grid's own scroll-driven
         thumbnail loader picking up past what the curtain covered. */
      watchRest();
      el.classList.add('done');
      /* by timer rather than transitionend: prefers-reduced-motion removes
         the transition outright, and an event that never fires would leave a
         full-screen element sitting over the page forever */
      setTimeout(function(){ el.classList.add('gone'); }, 900);
    }

    /* setInterval, not requestAnimationFrame. rAF is the better tool when it
       runs, but it is suspended outright in some embedded webviews and
       whenever the page isn't compositing — and when it doesn't run, the
       readout silently freezes at 0% while the images load behind it, which
       is exactly the failure this replaces. A timer always fires.

       The easing is driven by elapsed time rather than by counting ticks,
       which matters for the same reason: a throttled timer firing once a
       second would otherwise take ten seconds to cover the ground it should
       cover in half of one. Same curve, expressed per millisecond instead of
       per frame, so the count-up lasts the same ~0.6s at any tick rate. */
    var EASE_PER_FRAME = 0.18, FRAME_MS = 1000/60;
    var lastStep = (window.performance && performance.now) ? performance.now() : Date.now();
    function step(){
      if(finished) return;
      var now = (window.performance && performance.now) ? performance.now() : Date.now();
      var dt = Math.min(1000, Math.max(0, now - lastStep));
      lastStep = now;
      var k = 1 - Math.pow(1 - EASE_PER_FRAME, dt/FRAME_MS);
      shownP += (targetP - shownP) * k;
      if(targetP - shownP < 0.001) shownP = targetP;
      render(shownP);
      if(targetP >= 1 && shownP >= 0.999) finish();
    }
    stepTimer = setInterval(step, 16);

    /* The load event is what the queue waits on. decode() is requested too,
       so the first paint after the curtain has nothing left to do — but it
       is deliberately NOT awaited: decode() carries no guarantee that it
       ever settles (in a context that isn't compositing it simply never
       does), and one promise that never resolves stalls every image queued
       behind it. The curtain's own ~780ms is the real headroom a decode
       needs, and it runs after the last load has landed.

       An error settles exactly like a load: a missing file must not hold
       the door shut. */
    function settleOn(img, settle){
      var fired = false;
      function done(){
        if(fired) return;
        fired = true;
        if(img.decode){ try{ img.decode().catch(function(){}); }catch(e){} }
        settle();
      }
      /* out of line even when it's already there, so settle() never re-enters
         pump() from inside pump()'s own loop */
      if(img.complete && img.naturalWidth){ setTimeout(done, 0); return; }
      img.addEventListener('load', done, {once:true});
      img.addEventListener('error', done, {once:true});
    }

    var next = 0, inFlight = 0, MAX_PARALLEL = 6;
    function pump(){
      while(inFlight < MAX_PARALLEL && next < total){
        var img = batch[next++];
        inFlight++;
        (function(one){
          var done = false;
          function settle(){
            if(done) return;      /* decode() and the load event can both land */
            done = true;
            inFlight--;
            loaded++;
            targetP = loaded/total;
            pump();
          }
          startLoad(one);
          settleOn(one, settle);
        })(img);
      }
    }
    if(total){ pump(); } else { targetP = 1; }
    render(0);

    /* a hard ceiling on how long this can hold the page. A stalled request
       or a bad connection must never leave someone stuck behind a curtain
       with no way through — past this point the grid simply fills in as it
       goes, the way it always did. */
    setTimeout(finish, 12000);
  })();

  /* ---------- mobile (<=680px): 3-column grid, so card labels have far less
     room than the desktop --ui-size assumes. Compute one font-size, applied
     uniformly to every card, sized against the worst case (a full 20-char
     code — the naming convention's own max length) rather than each card's
     actual text, so every real code is guaranteed to fit with room to
     spare, and all cards still read as one consistent size. ---------- */
  var MOBILE_BP = 680;
  var mobileQuery = window.matchMedia('(max-width:'+MOBILE_BP+'px)');
  /* the viewer's tag/vclose 1px-overlap fix (see .frame .tag in CSS) also
     applies across the tablet/iPad Pro range, not just true mobile — kept
     as a separate query since the rest of the mobile-only behavior (3-col
     grid, swipe carousel, etc.) still shouldn't kick in until MOBILE_BP. */
  var tabletViewerQuery = window.matchMedia('(min-width:'+(MOBILE_BP+1)+'px) and (max-width:1050px)');
  function sizeTagFont(){
    if(!mobileQuery.matches){
      document.documentElement.style.removeProperty('--tag-size');
      return;
    }
    var cell = grid.querySelector('.cell');
    if(!cell) return;
    var cellWidth = cell.getBoundingClientRect().width;
    var probe = document.createElement('span');
    probe.style.position = 'absolute';
    probe.style.top = '0';
    probe.style.left = '0';
    probe.style.visibility = 'hidden';
    probe.style.whiteSpace = 'nowrap';
    probe.style.fontFamily = getComputedStyle(document.body).fontFamily;
    probe.style.fontVariantNumeric = 'tabular-nums';
    var probeSize = 20; /* arbitrary reference size, just needs to be precise */
    probe.style.fontSize = probeSize+'px';
    probe.textContent = '00000000000000000000'; /* 20 chars: monospace, so digit choice doesn't matter */
    document.body.appendChild(probe);
    var probeWidth = probe.getBoundingClientRect().width;
    document.body.removeChild(probe);
    if(!probeWidth) return;
    var tagRightPadding = 4;
    var reserve = 0.86; /* ~14% breathing room past the 20-char worst case */
    var targetWidth = (cellWidth - tagRightPadding) * reserve;
    var fontSize = probeSize * (targetWidth / probeWidth);
    /* no lower floor here on purpose: fitting the 20-char worst case with
       the reserve margin above is the hard requirement, so it must always
       win over a "make it bigger for readability" floor that could push
       the text past the card edge on narrower phones. Only cap the top end,
       for the rare wide-viewport case. */
    fontSize = Math.min(15, fontSize);
    document.documentElement.style.setProperty('--tag-size', fontSize.toFixed(2)+'px');
  }
  sizeTagFont();

  /* ---------- constrain an element to one grid column's width (used to stop
     the footer's first block from overlapping the second) ---------- */
  function setColumnWidth(el){
    var sample = grid.querySelector('.cell');
    if(!sample) return;
    el.style.width = sample.getBoundingClientRect().width+'px';
  }

  /* ---------- keep the tagline flush with the grid's real 2nd column ---------- */
  /* position:relative + left is a pure paint-time offset: it does not feed
     back into a flex row's own space-between math the way margin-left did
     (that was shifting by only half the needed amount, since adding margin
     also changed how much free space space-between had to give out). Reused
     for both the header's tagline and the footer's second block. */
  function alignToColumn(el, colIndex){
    var cells = grid.querySelectorAll('.cell');
    if(cells.length <= colIndex || !el) return;
    el.style.position = 'relative';
    el.style.left = '0px';
    var targetLeft = cells[colIndex].getBoundingClientRect().left;
    var currentLeft = el.getBoundingClientRect().left;
    el.style.left = Math.round(targetLeft - currentLeft)+'px';
  }
  function alignTagline(){
    alignToColumn(document.querySelector('.tagline'), 1);
  }

  /* ---------- essay reader columns ----------
     Counts the first row's cells by shared offsetTop -- .grid is
     align-items:start, so the run of equal tops IS the column count, taken
     straight from the element that decides it rather than from a media
     query (which can't see whether the browser is currently spending
     10-15px of the width on a scrollbar, and so guesses wrong at exactly
     the widths where the count flips). Usable at every width, mobile
     included: the
     real grid doesn't taper down to fewer and fewer auto-fill columns as it
     narrows, it jumps straight to a fixed 3 under 680px (see .grid's own
     mobile rule), so 3 is a real, final tier here too — not a stand-in for
     a single-column phone stack. Clamped to [3,12], the full range the
     reader has hand-tuned tiers for. */
  function computeEssayReaderCols(){
    var m = measureRealGridColumns();
    return m ? m.widths.length : null;
  }

  /* ---------- essay reader columns: measured, not recomputed ----------
     An earlier version gave the reader its own repeat(N,1fr) grid, matching
     the real grid only in COLUMN COUNT and trusting the two independent 1fr
     computations to land on identical pixel widths. They don't always: two
     separate elements each dividing "however many px is left over" into N
     equal 1fr tracks can round the leftover remainder pixel(s) onto
     different tracks depending on each element's own exact available width,
     which is one own arithmetic problem removed from the real grid's -- any
     tiny difference between them (e.g. the real grid living in a normally-
     scrolling body while the reader's own scroll container has its
     scrollbar hidden a different way) shows up as drift that gets worse
     column over column, exactly the kind of bug already hit once before on
     the sandbox's own grid overlay.
     Copying the real cells' measured pixel widths verbatim removes the
     second computation entirely -- there is nothing left to disagree with,
     because it's the same number. */
  function measureRealGridColumns(){
    var cells = grid.querySelectorAll('.cell');
    if(cells.length < 2) return null;
    var firstTop = cells[0].offsetTop;
    var widths = [];
    var left = null;
    var prevRight = null;
    var gap = 14; /* desktop's own literal gap — fallback only, overwritten below the moment there are 2+ real cells to measure it from */
    for(var i=0;i<cells.length;i++){
      if(cells[i].offsetTop !== firstTop) break;
      var r = cells[i].getBoundingClientRect();
      if(left === null) left = r.left;
      if(prevRight !== null) gap = r.left - prevRight;
      prevRight = r.right;
      widths.push(r.width);
    }
    if(widths.length < 3) return null;
    return {widths: widths, left: left, gap: gap};
  }

  /* ---------- footer columns ----------
     Desktop: a flex row, width-constrained and column-aligned via the two
     helpers above. Mobile: a real 3-column CSS grid (see the media query)
     that already constrains each column's width on its own, forcing long
     footer text to wrap inside its own cell instead of running past it into
     "To top" — so on mobile this just clears any position/width leftover
     from a previous desktop-width pass instead of computing new ones. */
  function layoutFooter(){
    if(mobileQuery.matches){
      footerCol1.style.width = '';
      footerCol2.style.position = '';
      footerCol2.style.left = '';
      return;
    }
    setColumnWidth(footerCol1);
    alignToColumn(footerCol2, 1);
  }

  /* ---------- lock .word to its widest (planet-expanded) footprint ----------
     The planet-hover animation grows an element inside .word; since the
     topbar is a space-between flex row, any width change in .word shifts
     the tagline sideways to compensate — visible as the tagline twitching
     whenever the wordmark is hovered. Reserve the expanded footprint
     permanently so .word's contribution to that layout never changes,
     hover or not. */
  function lockWordWidth(){
    var wordEl = document.querySelector('.word');
    var siteWordmarkEl = document.getElementById('siteWordmark');
    var planetSlotEl = document.querySelector('.planet-slot');
    if(!wordEl || !siteWordmarkEl) return;
    /* adding then immediately removing .force-expanded is meant to be an
       invisible, instant measurement, never a real animation — but
       .planet-slot has its own width transition, and forcing a layout read
       (getBoundingClientRect) in between the add and the remove gives the
       browser two distinct observed style states to compare. On a tab that
       isn't actively being painted yet (a background tab still finishing
       setup, or one throttled while unfocused — the exact situation for a
       freshly opened tab that hasn't been clicked into) that comparison can
       land on separate rendering opportunities instead of collapsing into
       one, and the .4s transition gets queued for real. It then finishes
       asynchronously later, mid-flight, whenever the tab actually starts
       rendering — which is what showed up as the planet icon stuck
       half-expanded or clipped. Disabling the transition for the duration
       of the measurement removes the possibility entirely, regardless of
       the tab's paint/throttle timing. */
    if(planetSlotEl) planetSlotEl.style.transition = 'none';
    wordEl.style.width = 'auto';
    siteWordmarkEl.classList.add('force-expanded');
    var w = Math.ceil(wordEl.getBoundingClientRect().width);
    siteWordmarkEl.classList.remove('force-expanded');
    wordEl.style.width = (w+2)+'px'; /* +2px safety margin against rounding */
    if(planetSlotEl){
      void planetSlotEl.offsetWidth; /* flush the class removal before re-enabling the transition */
      planetSlotEl.style.transition = '';
    }
  }
  lockWordWidth();

  /* ---------- theme toggle ---------- */
  var root = document.documentElement;
  var themeToggle = document.getElementById('themeToggle');
  function applyTheme(t){
    if(t === 'dark'){ root.setAttribute('data-theme','dark'); themeToggle.textContent = 'Light'; }
    else { root.removeAttribute('data-theme'); themeToggle.textContent = 'Dark'; }
    /* Dark/Light have different letter counts, so the toggle's own content
       width changes — that shifts the flex row's space-between distribution,
       which is exactly what the tagline offset was measured against. */
    alignTagline();
  }
  var savedTheme = null;
  try{ savedTheme = localStorage.getItem('how-theme'); }catch(e){}
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  function onThemeToggleClick(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('how-theme', next); }catch(e){}
    playThemeClick();
    gcEvent('theme/'+next, 'Theme switched to '+next);
  }
  themeToggle.addEventListener('click', onThemeToggleClick);

  /* must run after theme-toggle's text is set: its content width affects the
     flex row's space-between distribution, which the tagline offset depends on */
  alignTagline();
  var footerCol1 = document.getElementById('footerCol1');
  var footerCol2 = document.getElementById('footerCol2');
  layoutFooter();

  /* ---------- wordmark planet: spins while hovered, freezes at whatever
     angle it reached the moment you leave (no snap back to 0) — except
     while the essay is open, where openAbout()/closeAbout() (below) drive
     it directly via forceStart/forceStop instead of hover: once the planet
     has slid out for the essay, it should keep turning for as long as the
     essay stays open, not stop the instant the pointer happens to leave
     the wordmark. ---------- */
  var planetSpin = (function(){
    var wordmarkEl = document.getElementById('siteWordmark');
    var planetIcon = document.querySelector('.planet-icon .planet-map');
    if(!wordmarkEl || !planetIcon) return {forceStart:function(){}, forceStop:function(){}};
    var angle = 0, spinning = false, lastT = null, raf = null, forced = false;
    var SPEED = 90; // deg/sec, counter-clockwise
    function tick(now){
      if(!spinning) return;
      if(lastT !== null){ angle -= SPEED * (now - lastT) / 1000; }
      lastT = now;
      planetIcon.style.transform = 'rotate('+angle+'deg)';
      raf = requestAnimationFrame(tick);
    }
    function startSpin(){
      if(spinning) return;
      spinning = true;
      lastT = null;
      raf = requestAnimationFrame(tick);
    }
    function stopSpin(){
      spinning = false;
      if(raf) cancelAnimationFrame(raf);
    }
    wordmarkEl.addEventListener('mouseenter', function(){
      if(forced) return; /* essay's already keeping it spinning regardless */
      startSpin();
    });
    wordmarkEl.addEventListener('mouseleave', function(){
      if(forced) return;
      stopSpin();
    });
    /* a backgrounded/hidden tab throttles or pauses rAF entirely; if it were
       still "spinning" when that happens, the next callback after the tab
       comes back can receive a huge elapsed-time gap and jump the icon
       through many full rotations in one frame — stop cleanly instead.
       Doesn't touch `forced`: if the essay is still open when the tab comes
       back, startSpin() below picks it back up as if nothing happened. */
    document.addEventListener('visibilitychange', function(){
      if(document.hidden && spinning){
        stopSpin();
      } else if(!document.hidden && forced){
        startSpin();
      }
    });
    /* dragging the window to a display with a different DPI/scale changes
       devicePixelRatio mid-flight. There is no dedicated browser event for
       that, only this matchMedia trick (the query only matches one exact
       dppx value, so it fires 'change' the instant the ratio moves away from
       it, and has to be re-armed for the new value each time). Without this,
       a stale lastT from before the jump gets diffed against the first frame
       after the move and produces a single huge elapsed-time delta, which is
       what read as the icon "biting"/jumping mid-spin. */
    function armDprWatch(){
      try{
        var mq = matchMedia('(resolution: '+window.devicePixelRatio+'dppx)');
        var onDprChange = function(){
          lastT = null;
          armDprWatch();
        };
        if(mq.addEventListener) mq.addEventListener('change', onDprChange, {once:true});
        else if(mq.addListener) mq.addListener(onDprChange);
      }catch(e){}
    }
    armDprWatch();
    return {
      forceStart: function(){ forced = true; startSpin(); },
      forceStop: function(){ forced = false; stopSpin(); }
    };
  })();


  /* ---------- essay reader: cover card click opens a Period's full essay.
     Modeled on the about-page open/close above, minus the wordmark's planet
     spin (that's specific to the site wordmark, not this page). ---------- */
  (function(){
    var essayReader = document.getElementById('essayReader');
    var essayReaderInner = document.getElementById('essayReaderInner');
    if(!essayReader || !essayReaderInner) return;

    var currentEssayCode = null;
    var currentEssay = null;
    var siteWordmark = document.getElementById('siteWordmark');

    /* dwell/read-to-end analytics, moved here wholesale from the old
       standalone About page -- same buckets and the same event names, so
       the numbers stay comparable across the rebuild. Only the About essay
       reports them (see openEssay), exactly as before. */
    var essayOpenedAt = 0;
    var essayReadToEnd = false;
    function dwellBucket(ms){
      var s = ms/1000;
      if(s < 10) return 'under-10s';
      if(s < 30) return '10-30s';
      if(s < 60) return '30-60s';
      if(s < 180) return '1-3min';
      return '3min-plus';
    }

    function renderEssayReader(essay, code){
      /* subtitle is optional -- a Period's cover card gives it one, the
         About essay (opened from the wordmark, no cover) has none, and an
         empty " — " dangling after the title is worse than no subtitle. */
      var html = '<div class="er-title">'+essay.title
        + (essay.subtitle ? '<span class="er-subtitle"> — '+essay.subtitle+'</span>' : '')
        + '</div>';
      essay.sections.forEach(function(s, i){
        var row = i + 2;
        var mt = (i === 0 ? 60 : 40) + 'px';
        var isLastSection = i === essay.sections.length - 1;
        var body = s.body.slice();
        /* the essay's very last paragraph gets a narrower closing treatment
           (see .er-text-final's per-tier widths in CSS) -- pulled out of the
           normal .er-text so it can sit in its own, later grid row instead
           of racing the rest of the section's text for the same row. */
        var closingPara = isLastSection ? body.pop() : null;
        var bodyHtml = body.map(function(p){ return '<p>'+essayRefs(p, essay, code)+'</p>'; }).join('');
        /* the subheading shares a row with whichever text actually sits at
           the top of this section -- normally that's the first line of
           .er-text, but when the closing paragraph IS the section's only
           paragraph (nothing left in .er-text at all), the sub has nothing
           left on row to sit beside and needs to move down to the closing
           paragraph's own row instead, or it's left stranded alone above an
           empty line. */
        var subRow = bodyHtml ? row : (closingPara ? row + 1 : row);
        html += '<div class="er-sub" style="grid-row:'+subRow+';margin-top:'+mt+'">'+s.sub+'</div>';
        if(bodyHtml) html += '<div class="er-text" style="grid-row:'+row+';margin-top:'+mt+'">'+bodyHtml+'</div>';
        if(closingPara){
          var closingMt = bodyHtml ? '16px' : mt;
          html += '<div class="er-text er-text-final" style="grid-row:'+(row+1)+';margin-top:'+closingMt+'"><p>'+essayRefs(closingPara, essay, code)+'</p></div>';
        }
      });
      essayReaderInner.innerHTML = html;
    }

    /* column count is the ONLY thing that ever varies with width — row
       numbers and margins are fixed regardless of tier (title is always row
       1, sections always start at row 2, per the earlier fix that dropped
       the title down a row at narrow tiers). So resize never needs to touch
       the DOM at all, just this one attribute/variable — rebuilding the
       whole innerHTML on every resize tick was the actual cause of the text
       visibly lagging a beat behind the real grid while dragging the window
       edge: a full rebuild is slow enough, and resize fires often enough
       during a drag, that the columns the reader picks can be a tick behind
       the ones the CSS attribute selector below is already rendering against
       by the time the rebuild finishes. Updating just the attribute has
       nothing to lag — the browser repaints the new column assignment on
       the very next frame, same as the real photo grid re-flowing its own
       auto-fill columns. */
    function applyEssayReaderCols(){
      var m = measureRealGridColumns();
      if(m === null){
        essayReaderInner.style.removeProperty('grid-template-columns');
        essayReaderInner.style.removeProperty('padding-left');
        essayReaderInner.style.removeProperty('padding-right');
        essayReaderInner.removeAttribute('data-cols');
        return;
      }
      var n = Math.max(3, Math.min(12, m.widths.length));
      var widths = m.widths.slice(0, n);
      /* explicit px tracks, not repeat(n,1fr): a grid with 1fr tracks needs
         its OWN available width to divide up, which asks this element's
         width computation to agree with the real grid's, pixel for pixel --
         exactly the thing that was quietly drifting. Literal widths don't
         divide anything; the browser just lays out these exact tracks, so
         there's no leftover-remainder rounding step left to disagree on. */
      essayReaderInner.style.gridTemplateColumns = widths.map(function(w){ return w.toFixed(2)+'px'; }).join(' ');
      /* the gap needs copying too, not just the widths: mobile's real .grid
         uses an 8px column-gap (gap:14px 8px), not the 14px every wider tier
         uses -- hardcoding 14px here (as an earlier version did) left every
         column after the first one quietly 6px further right than the real
         grid's, compounding tier over tier until the text ran past the
         right padding it was supposed to keep. */
      essayReaderInner.style.columnGap = m.gap.toFixed(2)+'px';
      /* padding-left is a single longhand override -- padding-top/bottom
         keep coming from syncEssayReaderTop / the .essay-reader-inner
         rule's own 60px, untouched. */
      essayReaderInner.style.paddingLeft = m.left.toFixed(2)+'px';
      /* padding-right needs its own override too, once the scrollbar became
         visible (an earlier version relied on the CSS rule's plain
         var(--pad) here, which was fine while the scrollbar was hidden and
         took no layout space at all). The real grid's own measurement above
         assumes a scrollbar-free box spanning the full viewport width --
         true for .grid itself (body's scroll is locked shut while this
         reader is open), but no longer true for this element now that IT
         has a real, space-taking scrollbar of its own. Without this, the
         grid's copied total width was always exactly one scrollbar's worth
         too wide for what's actually left to put it in, which is what the
         horizontal scrollbar at the bottom actually was. Subtracting the
         scrollbar's own measured width from the padding — rather than
         shrinking the grid — keeps the scrollbar sitting inside the normal
         var(--pad) margin instead of cutting into real column space. */
      var scrollbarW = essayReaderInner.offsetWidth - essayReaderInner.clientWidth;
      essayReaderInner.style.paddingRight = 'calc(var(--pad) - '+scrollbarW+'px)';
      essayReaderInner.setAttribute('data-cols', n);
    }

    /* same idea as the column-width copy above: the title's top should land
       exactly where the real grid's own card tags sit, not at some guessed
       offset below the header that happens to look close.
       This is now split across two properties instead of one: the box's
       own top is moved down to the header's real bottom edge (so the native
       scrollbar riding this box's edge starts there too, instead of running
       the full viewport height with its top few pixels hidden under the
       opaque sticky header) -- then padding-top makes up only whatever's
       left between that and the tag row, so the title itself still lands on
       the exact same line regardless of how tall the header currently is
       (compact state, font metrics, mobile). */
    function syncEssayReaderTop(){
      var topbarEl = document.querySelector('.topbar');
      var headerBottom = topbarEl.getBoundingClientRect().bottom;
      essayReaderInner.style.top = headerBottom + 'px';
      /* matching the real grid's own header-to-tag gap is what makes the
         title land exactly on the same line as the grid's card codes on
         wider tiers -- but on mobile the cards pack in only 14px below the
         header, which read as the title sitting stuck to it with no
         breathing room at all. There's no grid alignment worth preserving
         on this tier anyway (the reader's own 3-column layout doesn't
         otherwise line up with anything), so it gets the same floor as the
         gap between sections just below it (40px) instead of whatever the
         grid happens to leave. */
      var minGap = mobileQuery.matches ? 40 : 0;
      var firstTag = grid.querySelector('.tag');
      if(firstTag){
        var gap = firstTag.getBoundingClientRect().top - headerBottom;
        essayReaderInner.style.paddingTop = Math.max(minGap, gap) + 'px';
        return;
      }
      essayReaderInner.style.paddingTop = Math.max(minGap, 40) + 'px';
    }

    function refreshEssayReader(){
      if(!currentEssayCode) return;
      syncEssayReaderTop();
      applyEssayReaderCols();
    }

    function openEssay(code){
      var essay = ESSAYS[code];
      if(!essay) return;
      var wasOpen = essayReader.classList.contains('open');
      /* going from one essay straight into another (the wordmark, while a
         Period is up) has to read as Essay's OWN shutter arriving over the
         Period still on screen -- not as Period vanishing and a new shutter
         starting from scratch a moment later, which is what simply swapping
         this element's content and replaying its animation looked like:
         both essays live in the exact same box, so there's no real "Period"
         left to be seen UNDER anything once its text is overwritten.
         A frozen clone stands in for it: snapshotted here, before anything
         changes, inserted right before the real element (so plain DOM order
         -- both share the same z-index:6 -- puts the real one on top),
         holding still while the real box gets Essay's content and replays
         its shutter over it. Once fully covered the clone is invisible
         either way, so it's just discarded (see the setTimeout below) --
         nothing is left to reveal but the real page once Essay closes. */
      var changingEssay = wasOpen && currentEssayCode !== code;
      var ghost = null;
      if(changingEssay){
        ghost = essayReader.cloneNode(true);
        ghost.removeAttribute('id');
        var ghostInner = ghost.querySelector('#essayReaderInner');
        if(ghostInner){
          /* cloneNode copies markup, not runtime state -- without this the
             clone would start scrolled to its own top regardless of how far
             into Period the reader actually was, showing the wrong moment
             frozen behind the new shutter. */
          ghostInner.removeAttribute('id');
          ghostInner.scrollTop = essayReaderInner.scrollTop;
        }
        essayReader.parentNode.insertBefore(ghost, essayReader);
      }
      closePhotoLayer(true);
      /* NOT window.scrollTo(0,0): the reader is a position:fixed overlay
         covering the whole viewport regardless of where the main page is
         scrolled, and its OWN content already starts at essayReaderInner's
         scrollTop=0 below -- scrolling the page underneath achieved nothing
         except a visible flash on mobile, where the jump to the top ran
         BEFORE the shutter had covered anything, so it read as its own
         separate, jarring motion ahead of the actual open. */
      currentEssayCode = code;
      currentEssay = essay;
      syncEssayReaderTop();
      renderEssayReader(essay, code);
      applyEssayReaderCols();
      essayReaderInner.scrollTop = 0;
      if(changingEssay){
        essayReader.style.transition = 'none';
        essayReader.classList.remove('open');
        void essayReader.offsetHeight;
        essayReader.style.transition = '';
      }
      essayReader.classList.add('open');
      essayReader.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
      if(!wasOpen || changingEssay) playWhoosh('open');
      gcEvent('essay-reader/open/'+code, 'Essay reader opened: '+code);
      if(ghost){
        /* matches the shutter's own .6s clip-path transition, with a little
           slack -- by the time this fires the real reader has fully covered
           the screen, so removing the clone underneath it is imperceptible */
        setTimeout(function(){ ghost.remove(); }, 650);
      }

      /* the About essay is the one opened from the wordmark rather than a
         cover card, so it alone keeps the wordmark's planet spinning for as
         long as it's open (and its own analytics events, which predate the
         reader and are worth keeping comparable across the change). */
      if(code === 'ABOUT'){
        siteWordmark.classList.add('planet-out');
        planetSpin.forceStart();
        essayOpenedAt = Date.now();
        essayReadToEnd = false;
        gcEvent('essay/open', 'Essay opened');
      }

      /* same slot, same right edge as About's own hijack of this button —
         two separate close buttons stacked on the real header's Dark/Light
         toggle is what actually happens without this: this one at a lower
         z-index than the sticky header (10) would just render invisibly
         underneath it. */
      themeToggle.removeEventListener('click', onThemeToggleClick);
      themeToggle.textContent = 'Close';
      themeToggle.addEventListener('click', closeEssay);
      alignTagline();
    }
    function closeEssay(silent){
      essayReader.classList.remove('open');
      essayReader.setAttribute('aria-hidden','true');
      closePhotoLayer(true); /* a footnote photo left open over the text has nothing to sit over once the reader goes */
      if(currentEssayCode === 'ABOUT'){
        siteWordmark.classList.remove('planet-out');
        planetSpin.forceStop();
        if(essayOpenedAt){
          var bucket = dwellBucket(Date.now() - essayOpenedAt);
          gcEvent('essay/dwell/'+bucket, 'Essay dwell time: '+bucket);
          if(essayReadToEnd) gcEvent('essay/read-to-end', 'Essay scrolled to the end');
          essayOpenedAt = 0;
        }
      }
      /* silent===true only from a cross-overlay handoff (About or the
         viewer taking over while Period was still open) -- both cases lock
         body scroll again themselves within the same tick, so the usual
         whoosh AND the delayed overflow-release both have to skip too, or
         the release fires 620ms later and unlocks scroll out from under
         whichever overlay is actually open by then. A real close still
         gets both. */
      if(silent !== true){
        playWhoosh('close');
        setTimeout(function(){
          document.body.style.overflow = '';
        }, 620);
      }

      themeToggle.removeEventListener('click', closeEssay);
      themeToggle.textContent = root.getAttribute('data-theme') === 'dark' ? 'Light' : 'Dark';
      themeToggle.addEventListener('click', onThemeToggleClick);
      alignTagline();
    }
    /* ---------- footnote photo layer ----------
       Opened by a [0042]/[PHOTO] marker in the essay's own text. Deliberately
       NOT the fullscreen film-strip viewer: that one replaces the page and
       scrolls through a whole trip, whereas this is one photo laid over the
       essay you're still reading. */
    var photoLay = document.getElementById('photoLay');
    var photoLayHead = document.getElementById('photoLayHead');
    var photoLayStage = document.getElementById('photoLayStage');
    var photoLayCloseBtn = document.getElementById('photoLayClose');
    var photoLayFrame = null;
    var photoLayCentered = false;
    /* iPad Pro and narrower. At 5 columns and below the text has already
       eaten the width a photo could be laid into beside it, so the side
       layer stops making sense there -- see the click handler, which routes
       those tiers to the normal full-screen carousel instead, and this
       centered fallback for the one photo that isn't in the archive at all
       (the portrait in the About essay, which the carousel has no frame
       for). */
    var SIDE_LAYER_MIN_COLS = 6;

    /* the glyph box of an element's own text, which is what actually has to
       line up between two buttons -- their border boxes can sit at the same
       coordinates while the words inside them don't, once padding or font
       metrics differ. Returns null for anything with no text to measure. */
    function textBox(el){
      if(!el || !el.firstChild) return null;
      var r = document.createRange();
      r.selectNodeContents(el);
      var b = r.getBoundingClientRect();
      if(!b.width && !b.height) return null;
      return b;
    }

    /* the photo is sized off its own proportions at full height, flush to
       the right and bottom edges -- no grid snapping at all, which is the
       point: it reads as an object laid over the page. The exception is a
       landscape photo, which at full height would run most of the way
       across: that one gets its width capped at the essay title's own
       column and takes its height from there instead. */
    function layoutPhotoLayer(){
      if(!photoLay || !photoLayFrame || !photoLay.classList.contains('open')) return;
      var topbarEl = document.querySelector('.topbar');
      var headBottom = topbarEl.getBoundingClientRect().bottom;
      var vw = document.documentElement.clientWidth;
      var availH = Math.max(0, window.innerHeight - headBottom);
      var ar = photoLayFrame.ar || (2/3);
      var w, h, maxW;
      if(photoLayCentered){
        /* phone: width-driven, not height-driven -- full screen width, same
           as every other opened photo on a phone (the real carousel's own
           .frame .ph is width:100%; height:auto; aspect-ratio:var(--ar)).
           Sizing off availH like the side-layer case below does was the
           actual bug: a portrait photo's height-driven width came out
           narrower than the screen, leaving visible margins on both sides
           instead of running edge to edge. Height just follows from the
           width and the photo's own ratio, whatever that comes out to --
           if it runs past the bottom of the screen that's fine, same as it
           would be in the carousel. */
        w = vw;
        h = w / ar;
        maxW = vw;
      } else {
        w = availH * ar;
        h = availH;
        var titleEl = essayReaderInner.querySelector('.er-title');
        /* the title's own box starts at its column's left edge even though
           its text is nowrap and may visually overhang -- that edge is the
           cap the landscape case is measured against. */
        var capLeft = titleEl ? titleEl.getBoundingClientRect().left : 0;
        maxW = Math.max(0, vw - capLeft);
      }
      if(w > maxW && ar > 0){ w = maxW; h = w / ar; }
      /* the photo's right edge lands on the text block's own right edge --
         the same line Close and the last text column already sit on --
         rather than running flush to the screen. Measured off .er-text so
         it's the real column edge, not a second guess at var(--pad). */
      var textEl = essayReaderInner.querySelector('.er-text');
      var rightEdge = textEl ? textEl.getBoundingClientRect().right : vw;
      var left = photoLayCentered ? (vw - w)/2 : (rightEdge - w);
      /* the head spans the photo normally, so the wordmark stays visible
         beside it -- but the full width when centered, where there's no
         "beside" left and it should read as the viewer's own header does. */
      photoLayHead.style.width = (photoLayCentered ? vw : w) + 'px';
      photoLayHead.style.right = (photoLayCentered ? 0 : (vw - rightEdge)) + 'px';
      photoLayHead.style.height = headBottom + 'px';
      photoLayStage.style.left = left + 'px';
      photoLayStage.style.top = headBottom + 'px';
      photoLayStage.style.width = w + 'px';
      photoLayStage.style.height = h + 'px';
      /* land Close exactly on the real Dark/Close button underneath it --
         matched on the TEXT, not the boxes. Matching boxes was the bug: the
         header's own toggle carries padding:2px 0 and this one doesn't, so
         two boxes at the same top put their words 2px apart, and closing the
         photo made Close visibly hop. Position off the box first, then
         measure both glyph boxes and correct the remainder, which absorbs
         that padding and any font-metric difference in one step. */
      var tRect = themeToggle.getBoundingClientRect();
      photoLayCloseBtn.style.top = tRect.top + 'px';
      photoLayCloseBtn.style.right = Math.max(0, vw - tRect.right) + 'px';
      var toggleText = textBox(themeToggle);
      var closeText = textBox(photoLayCloseBtn);
      if(toggleText && closeText){
        var dTop = toggleText.top - closeText.top;
        var dRight = toggleText.right - closeText.right;
        if(isFinite(dTop) && dTop) photoLayCloseBtn.style.top = (tRect.top + dTop) + 'px';
        if(isFinite(dRight) && dRight) photoLayCloseBtn.style.right = Math.max(0, vw - tRect.right - dRight) + 'px';
      }
    }

    function openPhotoLayer(frame, centered){
      if(!photoLay || !frame || !frame.img) return;
      photoLayFrame = frame;
      photoLayCentered = !!centered;
      /* on a wide screen this Close sits directly on top of the reader's
         OWN Close, one layer down -- two identical words stacked, where
         only the top one is live. Naming it for what it actually closes
         removes the guess. On a phone the photo fills the screen and
         there's nothing to confuse it with, so the plain word is better
         there (and "Close photo" would crowd the small header). */
      photoLayCloseBtn.textContent = mobileQuery.matches ? 'Close' : 'Close photo';
      photoLay.classList.toggle('centered', photoLayCentered);
      /* same markup the viewer builds, so the loading state is the same one
         the rest of the site uses: the cached thumb blurred behind slats and
         a tint, with the full-res file fading in over it once it lands. */
      photoLayStage.innerHTML = phHtml(frame, false, false, false);
      var full = photoLayStage.querySelector('.ph-full');
      if(full){
        /* this photo is the only thing being asked for right now, so it has
           no reason to queue behind the grid's lazy thumbnails */
        full.setAttribute('fetchpriority','high');
        full.setAttribute('loading','eager');
        if(full.complete && full.naturalWidth){ full.classList.add('loaded'); }
        else full.addEventListener('load', function(){ full.classList.add('loaded'); }, {once:true});
      }
      photoLay.classList.add('open');
      photoLay.setAttribute('aria-hidden','false');
      layoutPhotoLayer();
      playWhoosh('open');
      gcEvent('essay-photo/open', 'Essay footnote photo opened');
    }

    function closePhotoLayer(silent){
      if(!photoLay || !photoLay.classList.contains('open')) return;
      photoLay.classList.remove('open');
      photoLay.setAttribute('aria-hidden','true');
      photoLayFrame = null;
      if(silent !== true) playWhoosh('close');
      /* clear the markup only once the shutter has actually finished
         retracting -- wiping it in the same tick blanks the photo out
         instead of letting it ride up behind the shutter. Matches the .6s
         clip-path transition, with a little slack. */
      setTimeout(function(){
        if(photoLay && !photoLay.classList.contains('open')) photoLayStage.innerHTML = '';
      }, 620);
    }

    if(photoLay){
      photoLayCloseBtn.addEventListener('click', function(){ closePhotoLayer(); });
      /* clicking the page beside the photo closes it too, the same
         click-outside-to-close the fullscreen viewer already has */
      photoLay.addEventListener('click', function(e){
        if(e.target === photoLay || e.target === photoLayHead) closePhotoLayer();
      });
      essayReaderInner.addEventListener('click', function(e){
        var ref = e.target && e.target.closest ? e.target.closest('.er-ref') : null;
        if(!ref) return;
        e.preventDefault();
        var cols = parseInt(essayReaderInner.getAttribute('data-cols'), 10) || 12;
        var sideLayer = cols >= SIDE_LAYER_MIN_COLS;
        if(ref.hasAttribute('data-essay-photo')){
          /* the About portrait isn't in the archive, so there's no carousel
             frame to hand it to -- it always opens as this layer. Only a
             PHONE gets the centered, full-bleed treatment; an iPad Pro at 5
             columns still has room beside the text, so it keeps the
             desktop's right-hand column exactly like the wider tiers. */
          if(currentEssay && currentEssay.photo) openPhotoLayer(currentEssay.photo, mobileQuery.matches);
          return;
        }
        var gi = parseInt(ref.getAttribute('data-gi'), 10);
        if(isNaN(gi) || !ARCHIVE[gi]) return;
        /* an archive photo on iPad Pro and narrower opens the way every
           other photo on the site does at that size: the full-screen
           carousel, which hands the reader back to this exact scroll
           position when it closes (see openViewerFromEssay/closeViewer). */
        if(!sideLayer && window.openViewerFromEssay){
          window.openViewerFromEssay(gi, currentEssayCode);
          return;
        }
        openPhotoLayer(ARCHIVE[gi], false);
      });
    }

    /* the wordmark opens the site's own essay. It used to be a whole second
       overlay with its own markup, grid, scroll container and per-tier
       column table, stacked at a lower z-index than this one -- which is
       why clicking it while a Period was open needed a shutter handoff
       between the two. There is only one reader now, so this is either a
       plain open or a content swap inside the reader that's already up. */
    if(siteWordmark){
      siteWordmark.addEventListener('click', function(){
        if(essayReader.classList.contains('open') && currentEssayCode === 'ABOUT'){
          closeEssay();
          return;
        }
        openEssay('ABOUT');
      });
    }

    window.openEssay = openEssay;
    window.closeEssay = closeEssay;
    /* a footnote photo on the narrow tiers opens the full-screen carousel.
       The reader deliberately stays OPEN underneath rather than being
       closed first: the viewer's own translucent wash then blurs the essay
       you were actually reading, not the grid on the home page behind it.
       That's the whole point -- real layers, each one sitting on the thing
       it came from. It also means there's nothing to restore on the way
       back: the reader is still there, still scrolled exactly where it was
       (see closeViewer, which now only has to leave it alone). */
    window.openViewerFromEssay = function(gi, code){
      viewerOpenedFromEssay = {code: code || currentEssayCode, scrollTop: essayReaderInner.scrollTop};
      openViewer(gi);
    };

    document.addEventListener('keydown', function(e){
      if(e.key !== 'Escape') return;
      /* the photo layer is the topmost thing open, so it's what Escape
         closes -- same rule its Close button follows against the header's
         own Close underneath it */
      if(photoLay && photoLay.classList.contains('open')){ closePhotoLayer(); return; }
      if(essayReader.classList.contains('open')) closeEssay();
    });
    window.addEventListener('resize', function(){
      if(!essayReader.classList.contains('open')) return;
      refreshEssayReader();
      layoutPhotoLayer();
    });

    /* same soft tick on scroll as everywhere else on the site (the main
       grid, .about-essay/.about-inner) — one shared gate size (64px) so it
       reads as the same sound, not a different instrument for this one
       page. 'scroll' rather than 'wheel'+'scroll' split: unlike the about
       page, this reader uses ONE scroll container on every tier, desktop
       and mobile alike, and 'scroll' alone already covers wheel, touch, and
       keyboard input without needing a separate deltaY-based listener. */
    var essayTickGate = makeTickGate(64);
    var essayLastY = null;
    essayReaderInner.addEventListener('scroll', function(){
      var y = essayReaderInner.scrollTop;
      var max = essayReaderInner.scrollHeight - essayReaderInner.clientHeight;
      var movingDown = essayLastY === null ? true : (y > essayLastY);
      essayLastY = y;
      var atBoundary = movingDown ? (y >= max - 0.5) : (y <= 0.5);
      if(!atBoundary && essayTickGate.check(y)) playTick();
      /* read-to-end, moved over from the old About page along with the rest
         of its analytics -- one reader now, so one place that reports it */
      if(max - y < 4) essayReadToEnd = true;
    }, {passive:true});
  })();

  /* ---------- soft lerp scroller ---------- */
  function makeLerp(getPos, setPos, factor){
    var target = null, running = false, cancelled = false;
    function tick(){
      if(cancelled){ running = false; cancelled = false; return; }
      var cur = getPos();
      var diff = target - cur;
      if(Math.abs(diff) < 0.5){
        setPos(target);
        running = false;
        return;
      }
      setPos(cur + diff*factor);
      requestAnimationFrame(tick);
    }
    return {
      set: function(v){
        target = v;
        cancelled = false;
        if(!running){ running = true; requestAnimationFrame(tick); }
      },
      get: function(){ return target; },
      sync: function(){ target = getPos(); },
      stop: function(){ cancelled = true; running = false; }
    };
  }

  var vLerp = makeLerp(
    function(){ return window.scrollY; },
    function(v){ window.scrollTo(0, v); },
    0.114
  );
  document.getElementById('toTopBtn').addEventListener('click', function(){
    vLerp.set(0);
    playWhoosh('open', {rough:true, vol:0.0112});
    gcEvent('totop/click', 'To top clicked');
  });

  var bylineLink = document.querySelector('.byline-link');
  if(bylineLink){
    /* target="_blank" — the current page never unloads, so there's no risk
       of navigation cutting this off before it sends. */
    bylineLink.addEventListener('click', function(){
      gcEvent('byline/click', 'A.UBV. clicked');
    });
  }

  /* ---------- viewer ---------- */
  var viewer = document.getElementById('viewer');

  /* stopping the "to top" animation is the only job left here — the tick
     itself moved to the 'scroll' listener below, which reacts to how far the
     page has actually moved rather than how many wheel events it took to
     get there. See that listener for why. */
  window.addEventListener('wheel', function(e){
    var aboutIsOpen = document.getElementById('essayReader').classList.contains('open');
    if(!viewer.classList.contains('open') && !aboutIsOpen){
      vLerp.stop();
    }
  }, {passive:true});

  /* same idea, mobile's input method — 'wheel' above only ever sees a mouse
     or trackpad, never a touch swipe. Without this, a lerp already easing
     the page (the "To top" button, or a straggler from closeViewer — see
     there) had nothing to cancel it the moment a reader's own thumb took
     over, and fought the real scroll until it finished converging. */
  window.addEventListener('touchstart', function(){
    var aboutIsOpen = document.getElementById('essayReader').classList.contains('open');
    if(!viewer.classList.contains('open') && !aboutIsOpen){
      vLerp.stop();
    }
  }, {passive:true});

  document.addEventListener('keydown', function(e){
    var scrollKeys = ['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '];
    if(scrollKeys.indexOf(e.key) !== -1 && !viewer.classList.contains('open')){
      vLerp.stop();
    }
  });

  /* a light haptic tap to go with the tick. navigator.vibrate is an Android
     thing — iOS Safari doesn't implement it at all and there's no web API
     that reaches the Taptic Engine, so on an iPhone this is simply a no-op
     and the tick alone carries the feedback. Anyone who has asked the OS to
     tone down motion gets neither.

     12ms rather than the 5ms this started at: most Android haptics are LRA
     motors that need a few milliseconds just to spin up, so anything under
     about 10ms is either inaudible or never actually rendered — "no
     vibration at all" rather than "a subtle one". Chrome also gates
     vibrate() behind sticky user activation, so it stays silent until the
     reader has tapped the page at least once; scrolling alone doesn't grant
     it, which is why the very first swipe of a session can be quiet. */
  var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  function buzz(ms){
    if(prefersReducedMotion.matches) return;
    try{ if(navigator.vibrate) navigator.vibrate(ms || 12); }catch(e){}
  }

  /* driven off 'scroll' — how far the page has actually moved — rather than
     off 'wheel' events, which is what this used to be keyed on and is
     exactly the wrong signal: a mouse notches through ~100px per event, so
     one event = one tick reads fine, but a trackpad delivers the same
     distance as a burst of a dozen-plus tiny events, and one tick per event
     turned that into a machine-gun. A touch swipe never fires 'wheel' at
     all, so this is also the only thing that makes a sound on a phone.

     One tick per STEP px of travel reads as a ratchet — roughly a tick per
     row of cards — at any scroll speed, on any input device, because it's
     gated on distance covered, not on how many events it took to cover it. */
  var pageTickGate = makeTickGate(64);
  window.addEventListener('scroll', function(){
    var y = window.scrollY;
    /* the grid behind the viewer is scrolled programmatically while a photo
       is open (syncGridScrollToOpenFrame), and About locks the body — none
       of that is the reader's thumb, so it makes no sound. Re-baseline
       rather than just bailing out, or the first genuine scroll afterwards
       would inherit all that skipped travel and tick immediately. */
    if(viewer.classList.contains('open')
       || document.getElementById('essayReader').classList.contains('open')){
      pageTickGate.reset(y);
      return;
    }
    if(!pageTickGate.check(y)) return;
    /* silent at the very ends: the page isn't actually travelling any more,
       so it shouldn't keep ticking */
    var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    if(y <= 0.5 || y >= maxScroll - 0.5) return;
    playTick();
    buzz();
  }, {passive:true});

  var filmrow = document.getElementById('filmrow');
  var vclose = document.getElementById('vclose');
  var hsTrack = document.getElementById('hsTrack');
  var hsThumb = document.getElementById('hsThumb');
  var built = false;
  var frameEls = [];
  var hLerp = null;
  var viewerScrollUsedThisSession = false;
  /* reset in openViewer, not just declared here: without that, reopening on
     a different photo after closing would measure the first scroll of the
     new session against wherever the filmstrip was left scrolled to at the
     end of the LAST one — a stale baseline that could be an entire archive
     away, either firing a tick that shouldn't happen or swallowing one that
     should. */
  var filmTickGate = makeTickGate(64);

  /* desktop only: the filmrow has generous padding (50vw each side, see
     CSS) so the first/last photo CAN be scrolled to dead center same as any
     other — but nothing stopped you from continuing to scroll past that
     point into the empty padding beyond it. Clamp the scrollable range to
     exactly [first photo centered, last photo centered] instead of the
     full padded scrollWidth, so scrolling stops right there and only
     reverses from there. Mobile keeps its native full-range swipe/snap —
     it doesn't have this padding-runway setup at all. */
  /* desktop-only left margin for the very first photo (see getFilmrowBounds
     and openViewer) — matches the header/grid's own edge padding rather
     than sitting flush against the raw screen edge. --pad is a clamp(), and
     getComputedStyle().getPropertyValue on a custom property returns its
     literal source text ("clamp(16px,4vw,40px)"), not a resolved length —
     parseFloat on that is NaN. Resolving it through a disposable probe
     element instead of reading some existing element's own computed
     padding (e.g. .topbar's) sidesteps that element ever being mid
     CSS-transition or otherwise not reflecting --pad's current value. */
  function getDeskPad(){
    if(mobileQuery.matches) return 0;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;visibility:hidden;width:var(--pad);';
    document.body.appendChild(probe);
    var px = parseFloat(getComputedStyle(probe).width) || 0;
    document.body.removeChild(probe);
    return px;
  }

  function getFilmrowBounds(){
    if(mobileQuery.matches || !frameEls.length){
      return {min:0, max: filmrow.scrollWidth - filmrow.clientWidth};
    }
    var first = frameEls[0];
    var last = frameEls[frameEls.length-1];
    /* every other resting point centres its photo — but the very first
       photo in the whole archive has nothing to its left to reveal, so
       centering it just leaves dead translucent space there. It rests
       flush against the edge (plus getDeskPad()) instead — this is the
       boundary the wheel handler, the hs-track buttons, and hLerp all clamp
       against, so scrolling all the way back here (not just opening this
       photo directly, see openViewer) lands on the same flush position
       rather than snapping back to centred. */
    var min = Math.max(0, first.offsetLeft - getDeskPad());
    var max = last.offsetLeft + last.offsetWidth/2 - filmrow.clientWidth/2;
    return {min: min, max: max};
  }

  function buildViewer(){
    if(built) return;
    built = true;
    var html = '';
    ARCHIVE.forEach(function(f){
      html += '<div class="frame'+(f.land?' land':'')+'" data-gi="'+f.gi+'" data-ar="'+f.ar+'" style="--ar:'+f.ar+'">'
        + '<div class="tag"><span>'+f.code+'</span></div>'
