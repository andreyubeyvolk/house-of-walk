        + '<div class="phwrap">'+phHtml(f, f.land)+'</div>'
        + '</div>';
    });
    filmrow.innerHTML = html;
    frameEls = Array.prototype.slice.call(filmrow.querySelectorAll('.frame'));

    frameEls.forEach(function(el){
      if(!el.classList.contains('land')) return;
      el.querySelector('.ph').addEventListener('click', function(){
        el.classList.toggle('expanded');
        layoutFrames();
      });
    });

    watchPhImages(filmrow);
    filmrow.querySelectorAll('.ph-full').forEach(function(fullImg){
      if(fullImg.complete){ fullImg.classList.add('loaded'); }
      else { fullImg.addEventListener('load', function(){ fullImg.classList.add('loaded'); }); }
    });

    hLerp = makeLerp(
      function(){ return filmrow.scrollLeft; },
      function(v){ filmrow.scrollLeft = v; updateThumb(); },
      0.133
    );

    /* same reasoning as the main page's 'scroll' listener (see makeTickGate):
       gate on how far the filmstrip has actually moved, not on how many
       wheel events it took to move it — a trackpad fires many tiny deltaY
       events per mouse-wheel notch, and ticking once per event turned that
       into a machine-gun. filmTickGate is reset in openViewer, not declared
       fresh here, since this listener is attached exactly once (buildViewer
       only ever runs once) but the filmstrip gets re-centered on a new photo
       every time the viewer reopens. */
    filmrow.addEventListener('wheel', function(e){
      var dx = Math.abs(e.deltaX), dy = Math.abs(e.deltaY);
      if(dy >= dx){
        var bounds = getFilmrowBounds();
        var t = hLerp.get();
        if(t === null) t = filmrow.scrollLeft;
        var movingForward = e.deltaY > 0;
        var atBoundary = movingForward ? (t >= bounds.max - 0.5) : (t <= bounds.min + 0.5);
        t = Math.min(bounds.max, Math.max(bounds.min, t + e.deltaY*1.6));
        hLerp.set(t);
        if(!atBoundary && filmTickGate.check(t)) playTick();
        e.preventDefault();
      }
    }, {passive:false});

    filmrow.addEventListener('scroll', onScroll, {passive:true});

    /* wheel (desktop trackpad/mouse) and touchstart (mobile swipe) — not
       'scroll' itself, since that also fires for the programmatic centering
       scrollLeft assignment in openViewer, which isn't a real interaction. */
    function markViewerScrollUsed(){
      if(viewerScrollUsedThisSession) return;
      viewerScrollUsedThisSession = true;
      gcEvent('viewer/horizontal-scroll-used', 'Used horizontal scroll/swipe');
    }
    filmrow.addEventListener('wheel', markViewerScrollUsed, {passive:true});
    filmrow.addEventListener('touchstart', markViewerScrollUsed, {passive:true});

    /* desktop only: clicking the empty translucent padding around the
       first/last photo (or the gap between any two photos) closes the
       viewer, same as Close — e.target is filmrow itself only when the
       click didn't land on a .frame or anything inside one, since those
       would be the actual e.target via normal event bubbling. */
    filmrow.addEventListener('click', function(e){
      if(mobileQuery.matches) return;
      if(e.target === filmrow) closeViewer();
    });

    /* the two triangle buttons at each end of the bar, same behavior as a
       native scrollbar's arrow buttons: nudge by a fixed step, clamped to
       the scrollable range */
    var hsBtnLeft = document.getElementById('hsBtnLeft');
    var hsBtnRight = document.getElementById('hsBtnRight');
    var STEP = 220;
    function nudge(dir){
      var bounds = getFilmrowBounds();
      var t = hLerp.get();
      if(t === null) t = filmrow.scrollLeft;
      var atBoundary = dir > 0 ? (t >= bounds.max - 0.5) : (t <= bounds.min + 0.5);
      t = Math.min(bounds.max, Math.max(bounds.min, t + dir*STEP));
      hLerp.set(t);
      if(!atBoundary) playTick();
    }
    hsBtnLeft.addEventListener('click', function(){ nudge(-1); });
    hsBtnRight.addEventListener('click', function(){ nudge(1); });
  }

  function layoutFrames(){
    /* mobile: both halves of the viewer header size themselves off --vhead,
       which is the measured site-header height — refresh it before anything
       reads it. No per-frame measurement is involved on that tier at all,
       which is what makes it immune to the font-swap timing race that used
       to make this header render shorter on a fresh, unscrolled page load
       than after scrolling. Only tablet/iPad Pro/desktop still derive
       vclose's height from measuring .tag, since those tiers weren't
       reported to have the same timing problem. */
    syncViewerHeadMetrics();
    var tagH = frameEls.length ? frameEls[0].querySelector('.tag').getBoundingClientRect().height : 0;
    if(mobileQuery.matches){
      vclose.style.height = '';
    } else {
      /* .tag overlaps 1px down into the photo on tablet/iPad Pro
         (margin-bottom:-1px in CSS), which shifts the photo's actual top to
         (tagH - 1), not tagH. vclose is a separate fixed element (not
         covered by that overlap trick the way .phwrap/.ph are), so it needs
         to match the photo's real top, not tag's own unshifted bottom. */
      vclose.style.height = (tabletViewerQuery.matches ? tagH - 1 : tagH)+'px';
    }
    /* even with matching padding-top, line-height and font, a <button>'s
       text can still land a few px off from a <div>'s at the same box
       position — confirmed on a real phone, not just this test harness, so
       it's a genuine rendering difference, not something guessable with a
       single fixed CSS value (it didn't even scale consistently between
       viewport sizes when tried that way). Measure the actual gap directly
       and correct for it, so this stays right regardless of the exact
       cause or which browser is rendering it. */
    var tagTextEl = frameEls.length ? frameEls[0].querySelector('.tag span') : null;
    var vcloseTextEl = vclose.querySelector('span');
    if(mobileQuery.matches){
      /* not needed on mobile: both halves of the header start their text at
         the same --head-pt inside boxes of the same --vhead height, so
         they're on the same line by construction. Clear both properties a
         previous wider-viewport pass may have set, not just top — a
         leftover position:relative would offset the span all over again. */
      if(vcloseTextEl){
        vcloseTextEl.style.position = '';
        vcloseTextEl.style.top = '';
      }
    } else if(tagTextEl && vcloseTextEl){
      /* padding-top alone didn't converge in one measurement — a single
         corrected value, re-measured, still showed a residual gap, which
         means whatever's actually causing this doesn't scale linearly with
         padding (rounding at the compositing layer boundary is the likely
         culprit, since vclose is position:fixed and tag isn't). top on a
         position:relative element is a pure paint-time coordinate shift
         with no box-model/line-height involvement, so it isn't subject to
         the same rounding — nudge the text itself rather than its box. */
      vcloseTextEl.style.position = 'relative';
      vcloseTextEl.style.top = '0px';
      var tagTextTop = tagTextEl.getBoundingClientRect().top;
      var vcloseTextTop = vcloseTextEl.getBoundingClientRect().top;
      vcloseTextEl.style.top = (tagTextTop - vcloseTextTop)+'px';
    }

    if(mobileQuery.matches){
      /* mobile sizes each photo by width (CSS aspect-ratio, driven by the
         --ar custom property set on the frame in buildViewer), not by a
         JS-computed pixel height like desktop — clear any inline sizing a
         previous desktop-width layout pass left behind so the CSS takes
         over cleanly. */
      frameEls.forEach(function(el){
        el.style.width = '';
        var wrap = el.querySelector('.phwrap');
        var ph = el.querySelector('.ph');
        if(wrap) wrap.style.height = '';
        if(ph) ph.style.height = '';
      });
      updateThumb();
      return;
    }
    var vh = window.innerHeight;
    var H = vh - tagH;
    frameEls.forEach(function(el){
      var wrap = el.querySelector('.phwrap');
      var ph = el.querySelector('.ph');
      var expanded = el.classList.contains('expanded');
      var isLand = el.classList.contains('land');
      var h = (isLand && !expanded) ? H * 0.7 : H;
      var ar = parseFloat(el.dataset.ar);
      var w = Math.round(h * ar);
      wrap.style.height = Math.round(H)+'px';
      ph.style.height = Math.round(h)+'px';
      el.style.width = w+'px';
    });
    updateThumb();
  }

  function updateThumb(){
    var trackW = hsTrack.clientWidth;
    var viewW = filmrow.clientWidth;
    var bounds = getFilmrowBounds();
    var maxScroll = bounds.max - bounds.min;
    /* the thumb represents the clamped [min,max] scrollable range, not the
       full padded scrollWidth — the extra padding runway beyond the
       first/last centered photo isn't really "scrollable" anymore, so it
       shouldn't be represented as draggable thumb travel either. */
    var effectiveContentW = maxScroll + viewW;
    if(effectiveContentW <= viewW){ hsThumb.style.width = trackW+'px'; hsThumb.style.left = '0px'; return; }
    var thumbW = Math.max(30, trackW * (viewW / effectiveContentW));
    var ratio = maxScroll > 0 ? Math.min(1, Math.max(0, (filmrow.scrollLeft - bounds.min) / maxScroll)) : 0;
    var left = ratio * (trackW - thumbW);
    hsThumb.style.width = thumbW+'px';
    hsThumb.style.left = left+'px';
  }

  /* the frame (in the open viewer's filmstrip) nearest the centre of the
     view right now — shared by the live neighbour-prefetch (below, runs
     continuously while swiping) and the one-shot grid repositioning (runs
     once, only when the viewer closes — see closeViewer). Used to live on
     window.scrollTo'ing the background grid to match on every swipe too;
     that "while you're still looking at photos, keep nudging the page
     behind them" turned out to be exactly what was causing scroll jank
     after closing — some of that nudging was still in flight, or its
     layout cost was still being paid, right as real scroll input arrived.
     Repositioning the grid is now a single hard jump at close time only,
     hidden under the closing shutter, never live. */
  var lockedPageMaxScroll = 0;
  function findClosestFrame(){
    if(!frameEls.length) return null;
    var trackW = filmrow.clientWidth;
    var center = filmrow.scrollLeft + trackW/2;
    var closest = null, closestDist = Infinity;
    frameEls.forEach(function(el){
      var elCenter = el.offsetLeft + el.offsetWidth/2;
      var dist = Math.abs(elCenter - center);
      if(dist < closestDist){ closestDist = dist; closest = el; }
    });
    return closest;
  }

  /* called once, synchronously, right as closeViewer() starts — not on a
     timer, not while the viewer is still open. A hard jump rather than an
     eased one: it happens the instant the closing shutter begins covering
     the screen, so there's nothing to see snap either way. */
  function syncGridScrollToOpenFrame(){
    if(!mobileQuery.matches) return;
    var closest = findClosestFrame();
    if(!closest) return;
    var cell = grid.querySelector('.cell[data-gi="'+closest.dataset.gi+'"]');
    if(!cell) return;
    var cellRect = cell.getBoundingClientRect();
    var targetY = window.scrollY + cellRect.top - (window.innerHeight/2 - cellRect.height/2);
    targetY = Math.min(Math.max(0, lockedPageMaxScroll), Math.max(0, targetY));
    window.scrollTo(0, targetY);
  }

  /* mobile only: finds whichever photo is centred right now and warms its
     next neighbour. Runs continuously while swiping (debounced in onScroll)
     — unlike the grid repositioning above, this does no scrolling and no
     layout writes, just a fetchPriority/loading bump, so there's nothing
     here for it to jank against. */
  function prefetchAroundCurrent(){
    if(!mobileQuery.matches) return;
    var closest = findClosestFrame();
    if(!closest) return;
    prefetchNextNeighbor(+closest.dataset.gi);
  }

  /* the tapped photo's own file gets promoted to eager/high the moment it
     opens (see openViewer), but its neighbours still sat at
     fetchpriority="low" + loading="lazy" until the browser's own proximity
     check noticed them — which on a phone was right around the time you'd
     already swiped to them, showing the blurred loading state on every
     single swipe. Warming the very next one as soon as the current one
     settles means it's usually already there by the time you get to it. */
  function prefetchNextNeighbor(gi){
    var nextEl = filmrow.querySelector('[data-gi="'+(gi+1)+'"]');
    if(!nextEl) return;
    var img = nextEl.querySelector('.ph-full');
    if(img && !img.complete){
      img.loading = 'eager';
      img.fetchPriority = 'high';
    }
  }

  var scrollTicking = false;
  var gridSyncDebounce = null;
  function onScroll(){
    if(scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(function(){
      scrollTicking = false;
      updateThumb();
    });
    /* debounced to once the swipe settles rather than on every scroll
       frame — prefetchAroundCurrent does a linear scan over every frame in
       the archive, cheap once but not free 60 times a second during an
       active swipe. No scrolling happens here at all now (see
       syncGridScrollToOpenFrame's own comment) — this only ever warms the
       next photo's file. */
    clearTimeout(gridSyncDebounce);
    gridSyncDebounce = setTimeout(prefetchAroundCurrent, 100);
  }

  /* set only by window.openViewerFromEssay (essay-reader IIFE, below) --
     lets closeViewer know to hand the reader back to the Period essay it
     was actually opened from, at the exact scroll position it was at,
     instead of dumping them on the bare grid the way a viewer opened from
     a grid card normally does. */
  var viewerOpenedFromEssay = null;

  function openViewer(gi){
    buildViewer();
    /* document.documentElement.scrollHeight collapses down to just
       clientHeight the moment body.overflow is locked below (nothing can
       "overflow" a hidden-overflow box, so the browser stops reporting the
       page's real extent) — cache the true value now, before locking, for
       syncGridScrollToOpenFrame to use for the rest of this viewer session. */
    lockedPageMaxScroll = document.documentElement.scrollHeight - window.innerHeight;
    viewer.classList.add('open');
    viewer.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    layoutFrames();
    var target = filmrow.querySelector('[data-gi="'+gi+'"]');
    if(target){
      /* the tapped photo's own full-resolution file should win the
         connection over its neighbours, not queue up behind whichever ones
         native lazy-loading happens to notice first — every frame starts at
         fetchpriority="low" (see phHtml), this is what promotes the one
         actually being looked at. loading="eager" matters as much as the
         priority hint: "lazy" makes the fetch wait for the browser's own
         intersection check, which runs on a later frame than this click
         handler, not "immediately, this line". */
      var targetImg = target.querySelector('.ph-full');
      if(targetImg && !targetImg.complete){
        targetImg.loading = 'eager';
        targetImg.fetchPriority = 'high';
      }
      /* THE thin white line some photos showed down their left edge on
         mobile. offsetLeft/offsetWidth/clientWidth are all specified to
         return ROUNDED integers, so on any device whose frame width isn't a
         whole number of CSS pixels this landed up to half a pixel away from
         the frame's true left edge — and since the error comes from
         rounding index x (width + gap), it varies photo by photo, which is
         why some opened clean and their neighbours didn't. What showed
         through that sub-pixel crack was the 10px flex gap between frames,
         painted in the viewer's near-white background.

         getBoundingClientRect is fractional, so measuring the target's
         centre against the container's centre and scrolling by the
         difference is exact regardless of the widths involved. Snapping the
         result to a whole device pixel then guarantees the frame's edge
         lands on the physical pixel grid, so there's no crack left to show
         through even at fractional device pixel ratios. */
      var frRect = filmrow.getBoundingClientRect();
      var tRect = target.getBoundingClientRect();
      /* every other photo centres itself in the strip (see .filmrow's 50vw
         padding above) so there's room to reveal a neighbour on either side
         — but the very first photo in the whole archive has no neighbour on
         its left, so centering it just leaves dead translucent space where
         there's nothing to scroll into. Align its left edge to the strip's
         left edge instead: it reads as "the start of the archive", not as a
         gap. Every other photo, including the last, keeps the centred
         treatment — the last one DOES have real content to its left. On
         mobile the frame is full-bleed (flex:0 0 100%), so flush-left IS
         edge-to-edge on purpose — matching the rest of that tier's design.
         On desktop, edge-to-edge instead reads as a mistake: every other
         photo in the strip sits well clear of the raw screen edge, so this
         one landing flush against it looks like a layout bug rather than
         "the start of the archive". Held off from the true edge by the same
         --pad the header/grid already use, so it lines up with them. */
      var delta = (gi === 0)
        ? (tRect.left - frRect.left - getDeskPad())
        : (tRect.left + tRect.width/2) - (frRect.left + frRect.width/2);
      var max = filmrow.scrollWidth - filmrow.clientWidth;
      var next = Math.min(max, Math.max(0, filmrow.scrollLeft + delta));
      var dpr = window.devicePixelRatio || 1;
      filmrow.scrollLeft = Math.round(next * dpr) / dpr;
    }
    hLerp.sync();
    filmTickGate.reset(); /* forget wherever the LAST viewer session left this
      — otherwise the first scroll on a newly opened photo gets measured
      against a filmstrip position from a previous photo, possibly an entire
      archive away */
    updateThumb();
    /* not syncGridScrollToOpenFrame here — the grid doesn't need
       repositioning at open (the reader just tapped this photo from right
       where the grid already was); that only happens once, at close, after
       they may have swiped somewhere else entirely. Just warm the next
       photo the same way every subsequent swipe does. */
    prefetchAroundCurrent();
    playWhoosh('open');

    viewerScrollUsedThisSession = false;
    var openedPhoto = ARCHIVE[gi];
    if(openedPhoto) gcEvent('photo/'+openedPhoto.code, 'Opened photo '+openedPhoto.code);

    /* on a freshly-loaded page (before the first scroll, header still
       expanded) the embedded font can still be mid-swap at the exact moment
       a photo is tapped — the very first layoutFrames() call above can end
       up measuring the tag against fallback-font metrics a beat before the
       real font settles, baking a stale height into vclose. Re-measure a
       couple of frames later to catch that case regardless of its exact
       cause; harmless/idempotent if nothing had actually changed. */
    requestAnimationFrame(function(){
      requestAnimationFrame(layoutFrames);
    });
  }

  function closeViewer(){
    /* a photo opened from a Period footnote link doesn't return to the bare
       grid like every other viewer close does -- it hands the reader back
       to the essay they were actually reading, at the exact line they left,
       via the same silent (no whoosh of its own) handoff openViewerFromEssay
       used going the other way. Grabbed and cleared up front so the normal
       close logic below (grid-scroll sync included) still runs unconditionally
       either way -- this only decides what happens after it. */
    var essayToReturnTo = viewerOpenedFromEssay;
    viewerOpenedFromEssay = null;
    /* the only time the background grid actually moves — a single hard
       jump to wherever the reader ended up swiping to, fired the instant
       the closing shutter starts covering the screen so there's nothing
       visible to snap. Used to also live-track this continuously while the
       viewer was still open (see that function's own comment); that's what
       was leaving scroll fights and jank behind once you actually closed
       something and tried to scroll for real. */
    syncGridScrollToOpenFrame();
    /* a stray prefetchAroundCurrent from onScroll's debounce (see there)
       firing after this is harmless — it doesn't scroll anything — but
       nothing needs it once the viewer's shut, so clear it anyway. */
    clearTimeout(gridSyncDebounce);
    vLerp.stop();
    viewer.classList.remove('open');
    viewer.setAttribute('aria-hidden','true');
    if(essayToReturnTo){
      /* the reader was never closed on the way in -- it has been sitting
         underneath this whole time, still scrolled exactly where it was, so
         there is nothing to reopen or restore. Only two things must NOT
         happen: body scroll must stay locked (that overlay is still up), and
         no scrollTop write, which would only fight what's already correct. */
      playWhoosh('close');
      return;
    }
    playWhoosh('close');
    setTimeout(function(){
      document.body.style.overflow = '';
    }, 520);
  }

  grid.addEventListener('click', function(e){
    var cell = e.target.closest('.cell');
    if(!cell) return;
    if(cell.dataset.essay){
      /* the tilted cover straightens on the way out, so the tap gets the
         same acknowledgement a hover gives it on desktop. Cleared once the
         reader's shutter is fully down and the card can't be seen -- it
         has to be back on its tilt before it's ever revealed again. */
      cell.classList.add('tapped');
      setTimeout(function(){ cell.classList.remove('tapped'); }, 700);
      openEssay(cell.dataset.essay);
      return;
    }
    openViewer(parseInt(cell.dataset.gi,10));
  });
  grid.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ') return;
    var cell = e.target.closest('.cell');
    if(!cell) return;
    e.preventDefault();
    if(cell.dataset.essay){ openEssay(cell.dataset.essay); return; }
    openViewer(parseInt(cell.dataset.gi,10));
  });

  vclose.addEventListener('click', closeViewer);
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && viewer.classList.contains('open')) closeViewer();
  });

  var dragging = false, dragStartX = 0, dragStartScroll = 0;
  hsThumb.addEventListener('mousedown', function(e){
    if(hLerp) hLerp.stop();
    dragging = true;
    dragStartX = e.clientX;
    dragStartScroll = filmrow.scrollLeft;
    hsThumb.style.cursor = 'grabbing';
    e.preventDefault();
  });
  window.addEventListener('mousemove', function(e){
    if(!dragging) return;
    var trackW = hsTrack.clientWidth;
    var viewW = filmrow.clientWidth;
    var bounds = getFilmrowBounds();
    var maxScroll = bounds.max - bounds.min;
    var effectiveContentW = maxScroll + viewW;
    var thumbW = Math.max(30, trackW * (viewW / effectiveContentW));
    var deltaPx = e.clientX - dragStartX;
    var scrollDelta = deltaPx * (maxScroll / (trackW - thumbW));
    filmrow.scrollLeft = Math.min(bounds.max, Math.max(bounds.min, dragStartScroll + scrollDelta));
    updateThumb();
  });
  window.addEventListener('mouseup', function(){
    if(dragging){
      dragging = false;
      hsThumb.style.cursor = 'grab';
      if(hLerp) hLerp.sync();
    }
  });

  var resizeTimer;
  var lastResizeWidth = window.innerWidth;
  var widthChangedSinceLastPass = false;
  window.addEventListener('resize', function(){
    if(window.innerWidth !== lastResizeWidth){
      lastResizeWidth = window.innerWidth;
      widthChangedSinceLastPass = true;
    }
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      var widthChanged = widthChangedSinceLastPass;
      widthChangedSinceLastPass = false;
      /* on a phone the address bar slides in and out as you scroll, and every
         one of those fires a resize with the SAME width and a different
         height. Re-running the measurement passes then re-derives identical
         numbers with fresh sub-pixel rounding and writes them back as inline
         widths and offsets — which is visible as the header twitching under
         your thumb while you scroll. Nothing below depends on the viewport's
         height, so a height-only resize has nothing to recompute. */
      if(!widthChanged && mobileQuery.matches) return;
      updateTopbarCompact(); /* crossing the mobile breakpoint changes whether
                                the header is allowed to shrink at all */
      syncViewerHeadMetrics();
      if(built) layoutFrames();
      lockWordWidth();
      layoutFooter();
      alignTagline();
      sizeTagFont();
    }, 120);
  });

  /* ---------- header shrinks flush to its text once you start scrolling ----------
     Hysteresis (enter at 24px, exit at 4px) instead of one shared threshold:
     a sticky header that changes height near scrollY≈0 nudges scrollY itself,
     which can re-cross a single threshold and shake back and forth. */
  var topbarEl = document.querySelector('.topbar');
  function updateTopbarCompact(){
    /* mobile keeps the header at one fixed size — it's what the viewer's own
       header is measured against, and a height that moves under your thumb
       while you scroll isn't worth the few pixels it buys on a phone. The
       class is left off entirely rather than merely neutralised in CSS, so
       nothing downstream has to reason about a compact state that doesn't
       apply. */
    if(mobileQuery.matches){
      topbarEl.classList.remove('compact');
      return;
    }
    var y = window.scrollY;
    var isCompact = topbarEl.classList.contains('compact');
    if(!isCompact && y > 24){ topbarEl.classList.add('compact'); }
    else if(isCompact && y < 4){ topbarEl.classList.remove('compact'); }
  }
  window.addEventListener('scroll', updateTopbarCompact, {passive:true});
  updateTopbarCompact();

  /* Close has to land exactly where Dark is, and the photo code beside it on
     the same line. Both of those are centred in a strip of --vhead, so
     --vhead has to be twice the distance from the top of the header down to
     the centre of Dark's text — then the header's own first line sits dead
     centre in its own height too, and the viewer header is that same box.
     None of it is expressible in CSS, since it all comes from font metrics.

     The header is grown downwards to reach that height: --head-pb absorbs
     the difference, which is safe to iterate because padding-bottom moves
     the header's bottom edge without moving Dark (align-items:flex-start
     pins it to the top). Running this twice is therefore a no-op, not a
     runaway. The CSS fallbacks cover the window before the first
     measurement lands. */
  var themeToggleEl = document.getElementById('themeToggle');
  function syncViewerHeadMetrics(){
    var root = document.documentElement;
    if(!mobileQuery.matches){
      root.style.removeProperty('--vhead');
      root.style.removeProperty('--head-pb');
      return;
    }
    if(!themeToggleEl.firstChild) return;
    /* a Range over the text gives the glyph box; its centre is the same as
       the line box's centre (half-leading is symmetric), and unlike the
       button's border box it isn't offset by the button's own padding. */
    var rng = document.createRange();
    rng.selectNodeContents(themeToggleEl);
    var text = rng.getBoundingClientRect();
    if(!text.height) return;
    var tbRect = topbarEl.getBoundingClientRect();
    var target = ((text.top + text.height/2) - tbRect.top) * 2;
    if(!(target > 0)) return;
    var padBottom = parseFloat(getComputedStyle(topbarEl).paddingBottom) || 0;
    var next = padBottom + (target - tbRect.height);
    /* a sanity rail, not a tuning knob: if a measurement ever comes back
       nonsense the header keeps a sane shape instead of collapsing or
       ballooning */
    next = Math.max(0, Math.min(48, next));
    root.style.setProperty('--head-pb', next+'px');
    root.style.setProperty('--vhead', target+'px');
  }
  /* twice on purpose: the first pass measures a header that still has the
     CSS fallback padding, so the padding it derives lands a hundredth of a
     pixel out. The second pass measures the corrected header and converges.
     Idempotent after that — every later call is a no-op. */
  syncViewerHeadMetrics();
  syncViewerHeadMetrics();

  /* the embedded Spline Sans Mono / Impact fonts can finish decoding after this
     script already measured layout against fallback-font metrics; once real
     fonts are in, text widths shift and every position measured above goes
     stale — redo the column-width and alignment passes once fonts settle. */
  function relayoutForFonts(){
    lockWordWidth();
    layoutFooter();
    alignTagline();
    sizeTagFont();
    syncViewerHeadMetrics(); /* header height moves with the font metrics */
    if(built) layoutFrames();
  }
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(relayoutForFonts);
  }
  /* self-healing net: a tab that was opened in the background (a new tab
     that wasn't switched to immediately) can have its rendering throttled
     while inactive, which is exactly the condition lockWordWidth's own
     transition guard above targets — but re-run the whole measurement pass
     again the moment the tab genuinely becomes the focused, foreground one,
     so even a state that got stuck before that fix would still recover
     instead of staying wrong until some unrelated click happens to jostle
     it. Cheap and idempotent, safe to call repeatedly. */
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) relayoutForFonts();
  });
  window.addEventListener('focus', relayoutForFonts);

  /* every pixel measurement above (lockWordWidth's +2px margin, the
     planet-slot buffer, alignTagline's offset, frame widths) was computed
     against the devicePixelRatio of whichever display the window was on at
     the time. Dragging the window to a display with a different scale
     factor (laptop panel vs external monitor is the classic case) changes
     how fractional CSS pixels round to physical pixels without firing
     'resize' — the old measurements silently go stale, which is what showed
     up as the planet icon getting clipped/misaligned only after moving
     screens. Re-measure everything the same way the font-load handler
     already does, using the same matchMedia re-arm trick as the planet
     spinner. */
  function armLayoutDprWatch(){
    try{
      var mq = matchMedia('(resolution: '+window.devicePixelRatio+'dppx)');
      var onDprChange = function(){
        relayoutForFonts();
        armLayoutDprWatch();
      };
      if(mq.addEventListener) mq.addEventListener('change', onDprChange, {once:true});
      else if(mq.addListener) mq.addListener(onDprChange);
    }catch(e){}
  }
  armLayoutDprWatch();
})();
</script>
